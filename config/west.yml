manifest:
  defaults:
    revision: main

  remotes:
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      url: ../../zmk
      revision: advantage360
      clone-depth: 0
      import: app/west.yml

    # ZMK modules
    - name: zmk-adaptive-key
      remote: urob
      path: modules/urob/zmk-adaptive-key
    - name: zmk-auto-layer
      remote: urob
      path: modules/urob/zmk-auto-layer
    - name: zmk-helpers
      remote: urob
      path: modules/urob/zmk-helpers
    - name: zmk-leader-key
      remote: urob
      path: modules/urob/zmk-leader-key
      revision: v0.3 # Set to same as ZMK version, see zmk/CHANGELOG.md
    - name: zmk-tri-state
      remote: urob
      path: modules/urob/zmk-tri-state

  self:
    path: config
