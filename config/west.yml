manifest:
  defaults:
    revision: main

  remotes:
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      url: ../../zmk
      revision: advantage360
      clone-depth: 0
      import: app/west.yml

    # ZMK modules
    - name: zmk-adaptive-key
      remote: urob
    - name: zmk-auto-layer
      remote: urob
    - name: zmk-helpers
      remote: urob
    - name: zmk-tri-state
      remote: urob

  self:
    path: config
